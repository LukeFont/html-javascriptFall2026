<!DOCTYPE html>
<html language="en">
    <head>
        <title>Week 3 Drawing using the HTML Canvas</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            #container{
                width: 800px;
                text-align: center;
                margin-left: auto;
                margin-right: auto;
            }
        </style>
    <head>
    <body>
        <div id="container">
                <h1>Week 3 Lab - Drawing on the HTML Canvas</h1>
            <canvas id="canvas" width="800" height="600" style="border: 1px solid black">
                Your browser does not support the HTML canvas element
            </canvas>
        </div>

        <!-- In document Javascript -->
         <script>
                //these are the common variables for setting up canvas
                var canvas = document.getElementById("canvas");
                var ctx = canvas.getContext("2d");

                //draw a square
                ctx.fillStyle = "red"; //could also use "#FF0000"
                ctx.fillRect(canvas.width/2 - 25, canvas.height/2 - 25, 50, 50);

                ctx.fillStyle = "yellow";
                ctx.fillRect(750, canvas.height/2 - 25, 50, 50);

                ctx.fillStyle = "green";
                ctx.fillRect(0, 0, 50, 50);

                ctx.fillStyle = "blue";
                ctx.fillRect(0, canvas.height - 50, 50, 50);

                ctx.fillStyle = "orange";
                ctx.fillRect(750, 0, 50, 50);

                ctx.fillStyle = "cyan";
                ctx.fillRect(750, canvas.height - 50, 50, 50);
                //outline box
                ctx.strokeStyle = "black";
                ctx.lineWidth = 2;
                ctx.strokeRect(750, canvas.height - 50, 50, 50);

                //lets draw some lines
                ctx.strokeStyle = "black";
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(800,600);
                ctx.stroke();

                ctx.strokeStyle = "black";
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(800, 0);
                ctx.lineTo(canvas.width/2 + 25, canvas.height/2 -25);
                ctx.lineTo(canvas.width/2 + 25, canvas.height/2 + 25)
                ctx.lineTo(canvas.width/2 + -25, canvas.height/2 + 25)
                ctx.lineTo(canvas.width/2 + -25, canvas.height/2 -25)
                ctx.lineTo(canvas.width/2 + +25, canvas.height/2 -25)
                ctx.stroke();

                //draw some circles
                ctx.beginPath();
                ctx.arc(400, 300, 100, 0, 2 * Math.PI);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, 100, 0, 2 * Math.PI);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 600, 100, 0, 2 * Math.PI);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(800, 0, 100, 0, 2 * Math.PI);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(800, 300, 100, 0, 2 * Math.PI);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(800, 600, 100, 0, 2 * Math.PI);
                ctx.stroke();

                
                ctx.beginPath();
                ctx.arc(150, 300, 100, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "green";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(625, 300, 100, 45 * Math.PI / 180, 315 * Math.PI / 180);
                ctx.lineTo(625, 300);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
         </script>
    </body>
<html>
