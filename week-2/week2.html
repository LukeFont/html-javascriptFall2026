<!DOCTYPE html>
<html>
    <head>
        <title>Week 2 JavaScript Lab</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @font-face{
                font-family: digital;
                src: url("fonts/DS-DIGIT.TTF");
            }
            @font-face{
                font-family: morris;
                src: url("fonts/MorrisRomanBlack.ttf");
            }
            body{
                background-color:cornflowerblue;
                
            }
            #container{
                width: 100%;
                text-align: center;
            }
            #output{
                font-family: "digital";
                font-size: 60px;
                color: green;
                background-color: black;
                width: 100px;
                margin-left: auto;
                margin-right: auto;
            }
            h1, h2{
                font-family: "morris";
                font-weight: normal;
            }
            #btn:hover{
                transform: scale(1.05)
            }
            #btn:active{
                transform: scale(0.9)
            }
        </style>
    </head>
    <body>
        <div id="container">
            <h1>Week 2 JavaScript Lab</h1>
            <span id ="message"></span>
            <hr>
            <br>
            <h2>Button Clicker</h2>
            <h3 id="output">0</h3>
            <button type = "button" id="btn" style="background: none; border: none;">
                <img src="images/button.png" alt="Button Image" width="100">
            </button>
            <br>
            <!-- <input type="button" value="Click Me!" id ="btn"> -->
            <input type="button" value="Reset" id ="resetBtn">
        </div>
        

        <!-- Example JavaScript -->
         <script>
            // var name = prompt ("What is your name?");
            // var firstNumber = prompt("Give me your first number");
            // var secondNumber = prompt("Give me your second number");
            // var value = firstNumber * secondNumber;
            // console.log (value);
            // var message = `Hello ${name}!
            //     \nYour first number is: ${firstNumber}.
            //     \nYour second number is: ${secondNumber}.
            //     \nYour value is: ${value}.`;
            // console.log (message);
            // document.getElementById("message").innerHTML = message;
            // document.getElementById("message").style.color = "white";

            // Button Clicker Game
            var clickerButton = document.querySelector("#btn");
            var clickerOutput = document.querySelector("#output");
            var clearButton = document.querySelector("#resetBtn");
            var clickerSound = new Audio("audio/button-29.mp3");

            var numberOfClicks = 0;

            clickerButton.addEventListener("click", function() {
                numberOfClicks++;
                updateClickerDisplay();
                clickerSound.currentTime = 0;
                clickerSound.play();

                if (numberOfClicks == 25) {
                    alert("You have clicked 25 times!!!");
                }
            });

            clearButton.addEventListener("click", function() {
                numberOfClicks = 0;
                updateClickerDisplay();
            });

            function updateClickerDisplay(){
                clickerOutput.innerHTML = numberOfClicks;
            }
         </script>
    </body>
</html>
